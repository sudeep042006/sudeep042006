<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="960" height="536" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Welcome to Sudeep's World - Backend Engineer</title>
  <desc id="desc">Animated backend engineering profile card for Sudeep Kuralkar: framework-agnostic backend engineer, Node/Express, Java/Spring, Python/FastAPI, Docker, Redis, MongoDB and an always-curious mindset.</desc>

  <defs>
    <style>
      .mono { font-family: Consolas, "SF Mono", Menlo, "Cascadia Mono", Courier New, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

      @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes ticker  { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 32% { opacity: 1; } 38% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 0; } }
      @keyframes blink   { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulse   { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.9); } }
      @keyframes ping    { 0% { transform: scale(.55); opacity: .65; } 80% { opacity: .04; } 100% { transform: scale(1.35); opacity: 0; } }
      @keyframes barfill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes flowto  { to { stroke-dashoffset: -220; } }
      @keyframes glow    { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

      .f    { animation: fadeUp .7s cubic-bezier(.22, 1, .36, 1) both; }
      .tk   { opacity: 0; animation: ticker 12s ease-in-out infinite both; }
      .tk2  { animation-delay: 4s; }
      .tk3  { animation-delay: 8s; }
      .caret{ animation: blink 1.1s steps(1) infinite; }
      .pulse{ transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
      .ping { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
      .p2   { animation-delay: 1.3s; }
      .flow { stroke-dasharray: 3 11; animation: flowto 2.4s linear infinite; }
      .coreglow { animation: glow 3.4s ease-in-out infinite; }
      .bar  { transform-box: fill-box; transform-origin: 0 50%; animation: barfill 1.3s cubic-bezier(.22, 1, .36, 1) both; }

      .d0  { animation-delay: .0s; }  .d1  { animation-delay: .15s; }
      .d2  { animation-delay: .3s; }  .d3  { animation-delay: .45s; }
      .d4  { animation-delay: .6s; }  .d5  { animation-delay: .8s; }
      .d6  { animation-delay: 1.0s; }
      .t1  { animation-delay: 1.1s; } .t2  { animation-delay: 1.35s; }
      .t3  { animation-delay: 1.6s; } .t4  { animation-delay: 1.85s; }
      .t5  { animation-delay: 2.1s; } .t6  { animation-delay: 2.35s; }
      .c1  { animation-delay: 1.4s; } .c2  { animation-delay: 1.55s; }
      .c3  { animation-delay: 1.7s; } .c4  { animation-delay: 1.85s; }
      .c5  { animation-delay: 2.0s; } .c6  { animation-delay: 2.15s; }
      .c7  { animation-delay: 2.3s; } .c8  { animation-delay: 2.45s; }
      .b1  { animation-delay: 2.7s; } .b2  { animation-delay: 2.9s; }
      .b3  { animation-delay: 3.1s; } .b4  { animation-delay: 3.3s; }

      .chip rect { transition: fill .2s ease, stroke .2s ease; }
      .chip:hover rect { fill: #123452; stroke: #22d3ee; }
      .chip:hover { transform: translateY(-2px); }

      .card { transition: transform .25s ease, stroke .25s ease; }
      .card:hover { transform: translateY(-3px); stroke: #2c3d5c; }

      @media (prefers-reduced-motion: reduce) {
        .f, .tk, .bar, .caret, .pulse, .ping, .flow, .coreglow { opacity: 1; animation: none; transform: none; }
        .tk2, .tk3 { display: none; }
      }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060d1e"/>
      <stop offset=".55" stop-color="#0a1428"/>
      <stop offset="1" stop-color="#0d1730"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="32" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="sweepG" x1="0" y1="0" x2="0" y2="536" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="700" cy="215" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="700" cy="215" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".6" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="radarG" cx="700" cy="215" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".40"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9fc4ff" opacity=".05"/>
    </pattern>

    <path id="ring2" d="M 850 215 A 150 150 0 1 1 849.99 215 Z" fill="none"/>
    <path id="ring1" d="M 780 215 A 80 80 0 1 1 779.99 215 Z" fill="none"/>
  </defs>

