      <rect x="178" y="170" width="160" height="32" rx="16" fill="#0f1f38" stroke="#1e3a5f" class="f d3"/>
      <text x="258" y="191" text-anchor="middle" class="f d3">backend engineer</text>
      <rect x="350" y="170" width="185" height="32" rx="16" fill="#0f1f38" stroke="#1e3a5f" class="f d3"/>
