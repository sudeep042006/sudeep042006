    <text x="450" y="33" text-anchor="middle" class="mono" font-size="13.5" fill="#5b6b84">sudeep@backend: ~/sudeep042006 - skills-anim.svg</text>
    <rect x="812" y="15" width="72" height="24" rx="12" fill="#0d1f33" stroke="#174f4a"/>
    <circle cx="826" cy="27" r="4" fill="#34d399" class="pulse"/>
    <text x="838" y="31.5" class="mono" font-size="10" fill="#34d399">LIVE</text>
  </g>

  <g id="hero">
    <text x="450" y="96" text-anchor="middle" class="mono f d1" font-size="15" letter-spacing="4" fill="#7dd3fc">WELCOME TO</text>
    <text x="450" y="150" text-anchor="middle" class="sans f d2" font-size="50" font-weight="800" letter-spacing="1" fill="url(#tGrad)">SUDEEP'S WORLD</text>

