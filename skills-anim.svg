    <text class="mono tk tk1 f" font-size="16.5" fill="#cbd5e1" x="450" y="250" text-anchor="middle">&gt; why?   every system hides a story worth understanding</text>
    <text class="mono tk tk2 f" font-size="16.5" fill="#cbd5e1" x="450" y="250" text-anchor="middle">&gt; how?   10k users . big data . failures . recovery . scale</text>
    <text class="mono tk tk3 f" font-size="16.5" fill="#cbd5e1" x="450" y="250" text-anchor="middle">&gt; build? async . secure . distributed . AI-aware</text>
    <rect x="748" y="243" width="9" height="15" rx="2" fill="#22d3ee" class="caret"/>
  </g>

